<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You, Saliha ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow:hidden;font-family:Segoe UI,sans-serif;background:radial-gradient(circle at 50% 45%,#30204d 0%,#140f24 38%,#070711 80%);color:white}
.glow{position:fixed;width:500px;height:500px;border-radius:50%;background:rgba(255,80,160,.13);filter:blur(90px);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.15);opacity:.9}}
.stars{position:fixed;inset:0;overflow:hidden;pointer-events:none}.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;opacity:0;animation:twinkle 4s infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.5)}}
.container{position:relative;z-index:5;height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;padding:25px}
.card{width:min(700px,95vw);padding:55px 35px;border:1px solid rgba(255,255,255,.13);border-radius:30px;background:rgba(255,255,255,.055);backdrop-filter:blur(18px);box-shadow:0 30px 100px rgba(0,0,0,.5),inset 0 0 30px rgba(255,255,255,.025);animation:appear 1.8s ease forwards}
@keyframes appear{from{opacity:0;transform:translateY(35px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.small{font-size:15px;letter-spacing:5px;text-transform:uppercase;color:#e8c9dd;margin-bottom:18px;opacity:0;animation:fadeIn 1s ease .8s forwards}
h1{font-size:clamp(48px,10vw,92px);line-height:1;font-weight:700;background:linear-gradient(90deg,#fff,#ffb5d8,#fff,#ff9dcb);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite,titleIn 1.2s ease .4s both}
@keyframes shine{to{background-position:300% center}}@keyframes titleIn{from{opacity:0;letter-spacing:20px;filter:blur(10px)}to{opacity:1;letter-spacing:normal;filter:blur(0)}}
.heart{display:inline-block;color:#ff75ad;margin-left:8px;animation:heartbeat 1.4s ease-in-out infinite;text-shadow:0 0 25px rgba(255,90,160,.8)}
@keyframes heartbeat{0%,100%{transform:scale(1)}20%{transform:scale(1.25)}40%{transform:scale(1)}60%{transform:scale(1.15)}}
.line{width:80px;height:2px;margin:30px auto;background:linear-gradient(90deg,transparent,#ff9ac9,transparent);box-shadow:0 0 15px #ff9ac9}
.message{font-size:18px;line-height:1.8;color:#ded6e3;max-width:560px;margin:auto;min-height:65px}
.cursor{display:inline-block;width:2px;height:20px;background:#ff9dcc;margin-left:3px;animation:blink .8s infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
button{margin-top:32px;padding:14px 30px;border:1px solid rgba(255,255,255,.2);border-radius:50px;background:linear-gradient(135deg,rgba(255,116,174,.22),rgba(156,101,255,.2));color:white;font-size:15px;letter-spacing:1px;cursor:pointer;transition:.35s;box-shadow:0 0 25px rgba(255,100,170,.12)}
button:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 0 35px rgba(255,100,170,.35)}
.floating-heart{position:fixed;bottom:-40px;z-index:2;color:#ff82b8;font-size:18px;pointer-events:none;animation:floatUp linear forwards;filter:drop-shadow(0 0 8px rgba(255,90,160,.7))}
@keyframes floatUp{0%{transform:translateY(0) rotate(0) scale(.7);opacity:0}10%{opacity:.9}80%{opacity:.7}100%{transform:translateY(-110vh) rotate(360deg) scale(1.2);opacity:0}}
.footer{position:fixed;bottom:18px;left:0;width:100%;text-align:center;color:rgba(255,255,255,.3);font-size:12px;letter-spacing:2px;z-index:10}
@keyframes fadeIn{to{opacity:1}}
@media(max-width:600px){.card{padding:45px 22px;border-radius:25px}.small{font-size:11px;letter-spacing:3px}.message{font-size:16px}.glow{width:300px;height:300px}}
</style>
</head>
<body>
<div class="glow"></div><div class="stars" id="stars"></div>
<main class="container"><div class="card">
<div class="small">A little message for</div>
<h1>Thank You <span class="heart">♥</span></h1>
<div class="line"></div>
<p class="message"><span id="typing"></span><span class="cursor"></span></p>
<button onclick="showMessage()">✨ Open My Message</button>
</div></main>
<div class="footer">MADE WITH ❤️ FOR SALIHA</div>
<script>
const stars=document.getElementById("stars");
for(let i=0;i<90;i++){const s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=Math.random()*4+"s";s.style.animationDuration=2+Math.random()*4+"s";stars.appendChild(s)}
const text="Saliha, thank you for being a beautiful part of my life. Some things are difficult to put into words, but I hope this little page says what my heart wants to say. ❤️";
const typing=document.getElementById("typing");let index=0;
function typeText(){if(index<text.length){typing.textContent+=text.charAt(index++);setTimeout(typeText,35)}}setTimeout(typeText,1500);
function createHeart(){const h=document.createElement("div");h.className="floating-heart";h.innerHTML=Math.random()>.5?"♥":"♡";h.style.left=Math.random()*100+"vw";h.style.fontSize=12+Math.random()*25+"px";const d=5+Math.random()*6;h.style.animationDuration=d+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),d*1000)}
setInterval(createHeart,550);
function showMessage(){const m=["Thank you, Saliha. ❤️","You are truly appreciated. ✨","Some people make life a little more beautiful. You are one of them. 🌸","Thank you for everything. 💖"];typing.style.opacity="0";setTimeout(()=>{typing.textContent=m[Math.floor(Math.random()*m.length)];typing.style.opacity="1"},300);for(let i=0;i<20;i++)setTimeout(createHeart,i*70)}
</script>
</body>
</html>
