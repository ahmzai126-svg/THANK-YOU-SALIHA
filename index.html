<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You, Saliha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 45%,#202b46 0%,#101522 42%,#06080e 100%)}
.bg{position:fixed;inset:0;overflow:hidden}.glow{position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(95,170,255,.10);filter:blur(100px);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.45}50%{transform:translate(-50%,-50%) scale(1.12);opacity:.85}}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:.8}}
.container{height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:2;text-align:center}
.card{width:min(760px,95vw);padding:58px 42px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(255,255,255,.055);backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.48);animation:enter 1.2s ease both}
@keyframes enter{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.label{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:#9db5d8;margin-bottom:20px;opacity:0;animation:fade 1s .6s forwards}
h1{font-size:clamp(48px,9vw,86px);line-height:1.05;font-weight:700;background:linear-gradient(90deg,#fff,#a9d4ff,#fff);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite,title 1s .25s both}
@keyframes shine{to{background-position:220% center}}@keyframes title{from{opacity:0;letter-spacing:18px;filter:blur(8px)}to{opacity:1;letter-spacing:normal;filter:blur(0)}}
.rule{width:90px;height:2px;margin:30px auto;background:linear-gradient(90deg,transparent,#8fc7ff,transparent)}
.message{max-width:610px;margin:auto;min-height:105px;font-size:18px;line-height:1.85;color:#d8dfeb}
.cursor{display:inline-block;width:2px;height:20px;background:#8fc7ff;margin-left:3px;vertical-align:middle;animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
button{margin-top:28px;padding:14px 28px;border-radius:50px;border:1px solid rgba(255,255,255,.16);background:rgba(120,180,255,.10);color:#fff;font-size:15px;letter-spacing:1px;cursor:pointer;transition:.3s}
button:hover{transform:translateY(-3px);background:rgba(120,180,255,.18);box-shadow:0 10px 30px rgba(70,150,255,.15)}
.footer{position:fixed;bottom:17px;left:0;width:100%;text-align:center;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.28);z-index:3}
@keyframes fade{to{opacity:1}}
@media(max-width:600px){.card{padding:45px 23px}.message{font-size:16px}.label{font-size:10px}}
</style>
</head>
<body>
<div class="bg"><div class="glow"></div><div id="stars"></div></div>
<main class="container"><div class="card">
<div class="label">A small note of appreciation</div>
<h1>Thank You, Saliha</h1>
<div class="rule"></div>
<p class="message"><span id="typing"></span><span class="cursor"></span></p>
<button onclick="showMessage()">Read One More Note</button>
</div></main>
<div class="footer">MADE WITH APPRECIATION • FOR SALIHA</div>
<script>
const stars=document.getElementById("stars");
for(let i=0;i<85;i++){const s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"vw";s.style.top=Math.random()*100+"vh";s.style.animationDelay=Math.random()*4+"s";s.style.animationDuration=(2+Math.random()*4)+"s";stars.appendChild(s)}
const notes=[
"Saliha, thank you for helping me with my assignments. Your support made things much easier, and I genuinely appreciate the time you gave me.",
"Thank you for helping me understand things, sharing your ideas, and creating code when I needed it. I really appreciate your help.",
"This page is simply a small way of saying: your help mattered, and I am genuinely thankful for it."
];
const typing=document.getElementById("typing");let text=notes[0],i=0;
function typeText(){if(i<text.length){typing.textContent+=text.charAt(i++);setTimeout(typeText,28)}}setTimeout(typeText,1300);
function showMessage(){text=notes[Math.floor(Math.random()*notes.length)];typing.style.opacity="0";setTimeout(()=>{typing.textContent="";i=0;typing.style.opacity="1";typeText()},250)}
</script>
</body>
</html>
